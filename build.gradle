plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		// ModMenu
		name = "terraformersmc maven"
		url = "https://maven.terraformersmc.com"
	}
	flatDir {
		dir "libs"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

	modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

	//modImplementation "blank:telluriumforge:${telluriumforge_version}-1.20.1-fabric"
	modImplementation  "maven.modrinth:telluriumforge:${telluriumforge_version}-1.20.1-fabric"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mod_version", mod_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"mod_version": mod_version,
				"archives_base_name": archives_base_name
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	version = "${project.version}-${minecraft_version}-fabric"

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {

	}
}